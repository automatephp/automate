name: Build and deploy to GitHub Pages
on:
    push:
        branches: [main]
    workflow_dispatch: # run manually

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: fileinfo, gd, mbstring

            - name: Build site
              env:
                  CECIL_VERSION: '8.9.1'
              run: |
                  curl -sSfLO "https://github.com/Cecilapp/Cecil/releases/download/${CECIL_VERSION}/cecil.phar"
                  php cecil.phar build doc/ -vv --config=cecil.yml

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: 'doc/_site/'

    deploy:
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4