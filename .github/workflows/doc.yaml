name: Build and deploy to GitHub Pages
on:
    push:
        branches: [main]
    release:
        types: [published]
    workflow_dispatch: # run manually

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: fileinfo, gd, mbstring

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '22'

            - name: Get the latest release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "version=$(gh release view --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

            - name: Build site
              env:
                  CECIL_VERSION: '8.69.4'
                  AUTOMATE_VERSION: ${{ steps.release.outputs.version }}
              run: |
                  curl -sSfLO "https://github.com/Cecilapp/Cecil/releases/download/${CECIL_VERSION}/cecil.phar"
                  php cecil.phar build doc/ -vv --config=cecil.yml

            - name: Build the search index
              run: npx -y pagefind@1.3.0 --site doc/_site

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: 'doc/_site/'

    deploy:
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4